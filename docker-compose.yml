services:
  postgres:
    image: postgres:16-alpine
    container_name: brjobs-postgres
    environment:
      POSTGRES_DB: brjobsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - brjobs-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brjobsdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./brjobs-java
    container_name: brjobs-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: brjobsdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/brjobsdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: Lax
      BRJOBS_JWT_SECRET: localDevSecretForJWTTokenGenerationAndValidationMustBeAtLeast256BitsLongForHS512Algorithm
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./brjobs-angular
    container_name: brjobs-frontend
    depends_on:
      - backend
    ports:
      - "4200:4200"

volumes:
  brjobs-postgres-data:

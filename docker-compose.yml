services:
  postgres:
    image: postgres:16-alpine
    container_name: brjobs-postgres
    environment:
      POSTGRES_DB: brjobsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - brjobs-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brjobsdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./brjobs-java
    container_name: brjobs-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: brjobsdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/brjobsdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: Lax
      BRJOBS_JWT_SECRET: localDevSecretForJWTTokenGenerationAndValidationMustBeAtLeast256BitsLongForHS512Algorithm
      # Dev local: expõe o código de reset na resposta para testar sem e-mail.
      # Em produção mantenha false (default) e configure o Resend abaixo.
      PASSWORD_RESET_EXPOSE_CODE: "true"
      # E-mail de "Esqueci minha senha" via Resend. Preencha RESEND_API_KEY (re_...)
      # e RESEND_FROM (remetente de um domínio verificado) para enviar de verdade.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-BRJobs <onboarding@resend.dev>}
      # Stripe (destaque de publicação). Preencha no .env da raiz para testar localmente.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      HIGHLIGHT_WEBHOOK_SECRET: ${HIGHLIGHT_WEBHOOK_SECRET:-}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./brjobs-angular
    container_name: brjobs-frontend
    depends_on:
      - backend
    ports:
      - "4200:4200"

volumes:
  brjobs-postgres-data:

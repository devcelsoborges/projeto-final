name: brjobs_mobile
description: "BRJobs - aplicativo mobile (Flutter) integrado ao backend de produção."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.6.1

  # Rede / sessão por cookie (espelha o site Angular)
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # Navegação
  go_router: ^14.6.2

  # Armazenamento
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

  # Login social
  google_sign_in: ^6.2.2

  # Mídia / localização / utilitários
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

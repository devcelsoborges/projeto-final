# Heap reduzido: o default do template (-Xmx8G) excede a RAM desta máquina (8 GB)
# e derruba o build (Dart VM "Could not start thread DartWorker").
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
kotlin.daemon.jvmargs=-Xmx512m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

spring.application.name=brjobs
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:brjobsdb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
brjobs.jwt.secret=${BRJOBS_JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidationMustBeAtLeast256BitsLongForHS512Algorithm}
brjobs.jwt.expiration=${BRJOBS_JWT_EXPIRATION:7200000}
auth.access-token-ttl=${AUTH_ACCESS_TOKEN_TTL:PT2H}
auth.refresh-token-ttl=${AUTH_REFRESH_TOKEN_TTL:PT168H}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

# ===== OAuth2 Social Login (Google, Facebook) =====
# IMPORTANTE: Obtenha essas credenciais GRATUITAMENTE em:
# Google: https://console.cloud.google.com
# Facebook: https://developers.facebook.com
# Apple: https://developer.apple.com

# Google OAuth2 (GRATUITO)
# 1. Criar projeto em Google Cloud Console
# 2. Ativar Google+ API
# 3. Criar credenciais (OAuth2 Client ID)
# 4. Copiar Client ID e Secret abaixo
oauth2.google.client-id=${GOOGLE_CLIENT_ID:562205988451-gu1vcc47c8nffla5eabhk6o3p00k8s1n.apps.googleusercontent.com}
oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:seu-google-client-secret-aqui}

brjobs.feature.structural-auth=${BRJOBS_FEATURE_STRUCTURAL_AUTH:true}
brjobs.feature.publication-geo=${BRJOBS_FEATURE_PUBLICATION_GEO:true}
brjobs.feature.dynamic-notifications=${BRJOBS_FEATURE_DYNAMIC_NOTIFICATIONS:true}

geocoding.provider=${GEOCODING_PROVIDER:nominatim}
nominatim.base-url=${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
nominatim.user-agent=${NOMINATIM_USER_AGENT:BRJobs/1.0 contato@brjobs.com.br}
nominatim.min-interval-ms=${NOMINATIM_MIN_INTERVAL_MS:1100}
geocoding.cache-ttl-days=${GEOCODING_CACHE_TTL_DAYS:365}

# Facebook OAuth2 (GRATUITO com plano Developer)
# 1. Criar app em developers.facebook.com
# 2. Adicionar "Facebook Login" product
# 3. Capturar App ID e App Secret
oauth2.facebook.app-id=${FACEBOOK_APP_ID:seu-facebook-app-id-aqui}
oauth2.facebook.app-secret=${FACEBOOK_APP_SECRET:seu-facebook-app-secret-aqui}

# Redirect URI (ajustar para seu domínio em produção)
oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:8080/login/oauth2/code}

# ===== Password Reset =====
app.password-reset.expires-minutes=${PASSWORD_RESET_EXPIRES_MINUTES:15}
app.password-reset.expose-code=${PASSWORD_RESET_EXPOSE_CODE:true}

# ===== Chat Anti-Spam =====
app.chat.rate-limit.enabled=${CHAT_RATE_LIMIT_ENABLED:true}
app.chat.rate-limit.max-messages-per-window=${CHAT_RATE_LIMIT_MAX_MESSAGES:20}
app.chat.rate-limit.window-seconds=${CHAT_RATE_LIMIT_WINDOW_SECONDS:60}
app.chat.rate-limit.min-interval-ms=${CHAT_RATE_LIMIT_MIN_INTERVAL_MS:800}
app.chat.rate-limit.duplicate-window-seconds=${CHAT_RATE_LIMIT_DUPLICATE_WINDOW_SECONDS:15}
app.chat.history.default-limit=${CHAT_HISTORY_DEFAULT_LIMIT:50}
app.chat.history.max-limit=${CHAT_HISTORY_MAX_LIMIT:100}
app.highlight.default-currency=${HIGHLIGHT_DEFAULT_CURRENCY:brl}
app.highlight.checkout.success-url=${HIGHLIGHT_CHECKOUT_SUCCESS_URL:http://localhost:4200/minhas-publicacoes?highlight=success}
app.highlight.checkout.cancel-url=${HIGHLIGHT_CHECKOUT_CANCEL_URL:http://localhost:4200/minhas-publicacoes?highlight=cancel}
app.highlight.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.highlight.webhook.secret=${HIGHLIGHT_WEBHOOK_SECRET:}
app.highlight.expiration-cron=${HIGHLIGHT_EXPIRATION_CRON:0 */1 * * * *}
app.highlight.redis.enabled=${REDIS_ENABLED:false}
app.highlight.redis.cache-ttl-seconds=${REDIS_CACHE_TTL_SECONDS:300}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}


spring.application.name=brjobs
spring.datasource.url=jdbc:postgresql://localhost:5432/brjobsdb
spring.datasource.username=postgres
spring.datasource.password=160788
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
brjobs.jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationMustBeAtLeast256BitsLongForHS512Algorithm
brjobs.jwt.expiration=3600000

# ===== OAuth2 Social Login (Google, Facebook, Apple) =====
# IMPORTANTE: Obtenha essas credenciais GRATUITAMENTE em:
# Google: https://console.cloud.google.com
# Facebook: https://developers.facebook.com
# Apple: https://developer.apple.com

# Google OAuth2 (GRATUITO)
# 1. Criar projeto em Google Cloud Console
# 2. Ativar Google+ API
# 3. Criar credenciais (OAuth2 Client ID)
# 4. Copiar Client ID e Secret abaixo
oauth2.google.client-id=${GOOGLE_CLIENT_ID:seu-google-client-id-aqui}
oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:seu-google-client-secret-aqui}

# Facebook OAuth2 (GRATUITO com plano Developer)
# 1. Criar app em developers.facebook.com
# 2. Adicionar "Facebook Login" product
# 3. Capturar App ID e App Secret
oauth2.facebook.app-id=${FACEBOOK_APP_ID:seu-facebook-app-id-aqui}
oauth2.facebook.app-secret=${FACEBOOK_APP_SECRET:seu-facebook-app-secret-aqui}

# Apple Sign-In (GRATUITO com Apple Developer Account)
# 1. Registrar app em developer.apple.com
# 2. Ativar "Sign in with Apple"
# 3. Criar key privada e obter IDs
oauth2.apple.client-id=${APPLE_CLIENT_ID:seu-apple-client-id-aqui}
oauth2.apple.team-id=${APPLE_TEAM_ID:seu-apple-team-id-aqui}
oauth2.apple.key-id=${APPLE_KEY_ID:seu-apple-key-id-aqui}

# Redirect URI (ajustar para seu domínio em produção)
oauth2.redirect-uri=http://localhost:8080/login/oauth2/code

# ===== Password Reset =====
app.password-reset.expires-minutes=15
app.password-reset.expose-code=true


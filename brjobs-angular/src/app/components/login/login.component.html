<div class="login-container">
  <div class="login-card">
    <h2>Bem-vindo ao BRJobs</h2>
    <p class="login-subtitle">Acesse sua conta para continuar</p>

    <!-- Mensagem de Erro (se houver) -->
    <div *ngIf="errorMessage" class="error-alert">
      <svg class="alert-icon" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
      </svg>
      {{ errorMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      
      <!-- Email -->
      <div class="form-group">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="seu.email@exemplo.com"
          [class.input-error]="form.get('email')?.touched && form.get('email')?.invalid"
        />
        <small *ngIf="getEmailError()" class="error-text">
          {{ getEmailError() }}
        </small>
      </div>

      <!-- Senha -->
      <div class="form-group">
        <label for="senha">Senha</label>
        <input
          id="senha"
          type="password"
          formControlName="senha"
          placeholder="Mínimo 8 caracteres"
          [class.input-error]="form.get('senha')?.touched && form.get('senha')?.invalid"
        />
        <small *ngIf="getSenhaError()" class="error-text">
          {{ getSenhaError() }}
        </small>
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="form-options">
        <div class="remember-me">
          <input 
            id="rememberMe" 
            type="checkbox" 
            name="rememberMe"
            [(ngModel)]="rememberMe"
            [ngModelOptions]="{standalone: true}"
            (ngModelChange)="onRememberMeChange($event)"
            [disabled]="loading"
          />
          <label for="rememberMe">Lembrar e-mail</label>
        </div>
        <a routerLink="/forgot-password" class="forgot-link">Esqueceu sua senha?</a>
      </div>

      <!-- Submit Button -->
      <button
        class="btn-primary"
        type="submit"
        [disabled]="loading || form.invalid"
      >
        <span *ngIf="loading" class="spinner" aria-hidden="true"></span>
        <span class="btn-label">{{ loading ? 'Entrando...' : 'Entrar' }}</span>
      </button>

    </form>

    <!-- Divisor -->
    <div class="divider">
      <span>Ou continue com</span>
    </div>

    <!-- Login Social -->
    <div class="social-login">
      <!-- Google -->
      <button
        type="button"
        class="btn-social btn-google"
        (click)="loginWithGoogle()"
        [disabled]="socialLoading || loading"
        title="Entrar com Google"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Google
      </button>

      <!-- Facebook -->
      <button
        type="button"
        class="btn-social btn-facebook"
        (click)="loginWithFacebook()"
        [disabled]="socialLoading || loading"
        title="Entrar com Facebook"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
        Facebook
      </button>

    </div>

    <!-- Link para Registro -->
    <div class="auth-footer">
      <p>Não tem uma conta? <a routerLink="/register" class="link-primary">Cadastre-se aqui</a></p>
    </div>
  </div>
</div>

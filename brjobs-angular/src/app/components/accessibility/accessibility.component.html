<div class="accessibility-container" role="region" aria-label="Ferramentas de acessibilidade">
  <button class="btn-accessibility" (click)="aumentarFonte()" aria-label="Aumentar tamanho da fonte">A+</button>
  <button class="btn-accessibility" (click)="diminuirFonte()" aria-label="Diminuir tamanho da fonte">A-</button>
  <button class="btn-accessibility" (click)="resetarFonte()" aria-label="Restaurar fonte padrão">A</button>
  <button class="btn-accessibility" (click)="lerTexto()" aria-label="Ler texto da página">🔊</button>
</div>
